<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400">
  <title>Vishal Jay Gupta — Digital Wave Animated Header</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#172554" stroke-width=".6" opacity=".35"/>
    </pattern>

    <style>
      .wave1 {
        stroke-dasharray: 18 12;
        animation: flow 8s linear infinite;
      }

      .wave2 {
        stroke-dasharray: 10 18;
        animation: flowReverse 11s linear infinite;
      }

      .wave3 {
        stroke-dasharray: 4 16;
        animation: flow 6s linear infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .blink {
        animation: blink 1.7s ease-in-out infinite;
      }

      .float1 {
        animation: float 4s ease-in-out infinite;
      }

      .float2 {
        animation: float 5s ease-in-out infinite 1s;
      }

      @keyframes flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -300; }
      }

      @keyframes flowReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 300; }
      }

      @keyframes pulse {
        0%,100% { opacity: .35; transform: scale(.85); }
        50% { opacity: 1; transform: scale(1.12); }
      }

      @keyframes blink {
        0%,45%,100% { opacity: .3; }
        55%,85% { opacity: 1; }
      }

      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1150" height="400" fill="url(#bg)"/>
  <rect width="1150" height="400" fill="url(#grid)"/>

  <!-- Atmospheric glow -->
  <ellipse cx="235" cy="205" rx="250" ry="150"
           fill="#0ea5e9" opacity=".07" filter="url(#softGlow)"/>

  <!-- Decorative data lines -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path class="wave1" stroke-width="1.2"
      d="M-30 282 C90 210 115 325 220 252 S355 176 465 246 S590 310 710 230"/>
    <path class="wave2" stroke-width="1"
      opacity=".55"
      d="M-40 310 C80 245 125 350 235 270 S365 195 475 265 S605 325 720 250"/>
    <path class="wave3" stroke-width=".8"
      opacity=".35"
      d="M-20 175 C95 250 145 130 245 202 S390 282 505 192"/>
  </g>

  <!-- Central digital core -->
  <g transform="translate(225 205)">
    <circle r="82" fill="#0ea5e9" opacity=".07" filter="url(#softGlow)"/>
    <circle r="57" fill="none" stroke="#164e63" stroke-width="1"/>
    <circle r="43" fill="none" stroke="#0e7490" stroke-width="1"
            stroke-dasharray="3 9" class="wave1"/>
    <circle r="30" fill="#020617" stroke="#22d3ee"
            stroke-width="1.7" filter="url(#glow)"/>

    <text x="0" y="5" text-anchor="middle"
          font-family="monospace" font-size="15"
          font-weight="700" fill="#ffffff">&gt;_</text>

    <g class="pulse">
      <circle cx="0" cy="-57" r="3" fill="#22d3ee"/>
      <circle cx="57" cy="0" r="2.5" fill="#818cf8"/>
      <circle cx="0" cy="57" r="3" fill="#06b6d4"/>
      <circle cx="-57" cy="0" r="2.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Floating data nodes -->
  <g filter="url(#glow)">
    <g class="float1">
      <circle cx="84" cy="102" r="3" fill="#38bdf8"/>
      <circle cx="84" cy="102" r="7" fill="#38bdf8" opacity=".08"/>
    </g>

    <g class="float2">
      <circle cx="358" cy="90" r="3" fill="#a78bfa"/>
    </g>

    <g class="float1">
      <circle cx="390" cy="322" r="3" fill="#22d3ee"/>
    </g>
  </g>

  <!-- Small constellation / circuit -->
  <g fill="none" stroke="#164e63" stroke-width="1">
    <path d="M410 68 L465 101 L530 72"/>
    <path d="M850 305 L905 270 L972 301 L1032 265"/>
  </g>

  <g fill="#22d3ee" class="blink">
    <circle cx="410" cy="68" r="2"/>
    <circle cx="465" cy="101" r="2"/>
    <circle cx="530" cy="72" r="2"/>
    <circle cx="850" cy="305" r="2"/>
    <circle cx="905" cy="270" r="2"/>
    <circle cx="972" cy="301" r="2"/>
    <circle cx="1032" cy="265" r="2"/>
  </g>

  <!-- Main identity -->
  <text x="450" y="174"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43" font-weight="800"
        letter-spacing="1"
        fill="url(#heading)">
    VISHAL JAY GUPTA
  </text>

  <text x="452" y="213"
        font-family="monospace"
        font-size="13"
        letter-spacing="3"
        fill="#94a3b8">
    FULL STACK DEVELOPER • JAVA • MERN • DSA
  </text>

  <text x="452" y="250"
        font-family="Georgia, serif"
        font-size="15"
        font-style="italic"
        fill="#cbd5e1">
    "Turning ideas into systems, one commit at a time."
  </text>

  <!-- Noticeable tagline -->
  <text x="452" y="282"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="700"
        letter-spacing="1.5"
        fill="#67e8f9"
        filter="url(#glow)">
    Insanely Delusional
  </text>

  <!-- System readout -->
  <rect x="452" y="310" width="8" height="8" rx="2"
        fill="#22d3ee" class="blink"/>

  <text x="470" y="318"
        font-family="monospace"
        font-size="10"
        letter-spacing="1"
        fill="#64748b">
    BUILD STATUS:
  </text>

  <text x="570" y="318"
        font-family="monospace"
        font-size="10"
        font-weight="700"
        fill="#22d3ee">
    BUILDING
  </text>

  <!-- Border -->
  <rect x="1" y="1" width="1148" height="398"
        fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>